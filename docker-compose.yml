version: "3"
# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:latest
    build: .
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    command: bash -lc "bundle config set --local path 'vendor/bundle' && bundle install && bundle exec jekyll serve --livereload --host 0.0.0.0 --port 8080"
